<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b78">
  <title>เข้าสู่ระบบ — GoodPlanner</title>
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
  <link rel="stylesheet" href="theme-dark.css">
  <script src="theme.js"></script>
</head>
<body class="auth-page">
  <button class="quiet-button theme-toggle" data-theme-toggle type="button" aria-pressed="false" aria-label="เปลี่ยนเป็นโหมดมืด">☾</button>
  <main class="auth-shell">
    <div class="auth-layout">
      {% include 'partials/auth-story.html' %}
      <section class="auth-card" aria-labelledby="page-title">
        <p class="auth-eyebrow">WELCOME BACK</p>
      <div class="intro">
        <h1 id="page-title">ยินดีต้อนรับกลับมา</h1>
        <p>เข้าสู่ระบบเพื่อเริ่มวางแผนวันดี ๆ ของคุณ</p>
      </div>

      <form id="login-form" data-mode="login" novalidate>
        <div class="field">
          <label for="email">อีเมล</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" autocapitalize="none" spellcheck="false" required aria-describedby="email-error">
          <p id="email-error" class="field-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <div class="label-row">
            <label for="password">รหัสผ่าน</label>
            <button type="button" class="text-button" id="forgot-password">ลืมรหัสผ่าน?</button>
          </div>
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="กรอกรหัสผ่านของคุณ" autocomplete="current-password" required aria-describedby="password-error">
            <button class="password-toggle" id="toggle-password" type="button" aria-label="แสดงรหัสผ่าน" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><path class="eye-slash" d="m4 3 16 18" stroke="currentColor" stroke-width="1.7"/></svg>
            </button>
          </div>
          <p id="password-error" class="field-error" aria-live="polite"></p>
        </div>
        <button class="submit-button" type="submit">เข้าสู่ระบบ <span aria-hidden="true">→</span></button>
      </form>

      <div class="divider"><span>หรือ</span></div>
      <button class="google-button" id="google-login" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.89-1.74 2.98-4.3 2.98-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.05.96-3.38.96-2.61 0-4.83-1.76-5.62-4.12H3.04v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.38 13.92a6 6 0 0 1 0-3.84V7.49H3.04a10 10 0 0 0 0 9.02l3.34-2.59Z"/><path fill="#EA4335" d="M12 5.96c1.47 0 2.79.5 3.82 1.5l2.86-2.86A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.96 5.49l3.34 2.59C7.17 7.72 9.39 5.96 12 5.96Z"/></svg>
        ดำเนินการต่อด้วย Google
      </button>
      <p class="signup-line">ยังไม่มีบัญชี? <a class="text-button" href="register.html">สมัครสมาชิก</a></p>
      <div class="notice" id="notice" role="status" tabindex="-1" hidden></div>
      </section>
    </div>
    <footer class="auth-footer">GoodPlanner / พื้นที่ของทุกแผนและทุกเป้าหมาย · <a href="/privacy.html">นโยบายความเป็นส่วนตัว</a></footer>
  </main>
</body>
</html>
