# Render Blueprint: one web service + one Postgres database.
# Secrets marked sync: false are typed into the Render dashboard, never committed.
services:
  - type: web
    name: goodplanner
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-prod.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn goodplanner.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /login.html
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_HTTPS
        value: "1"
      - key: PGSSLMODE
        value: prefer
      - key: DATABASE_URL
        fromDatabase:
          name: goodplanner-db
          property: connectionString
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CRON_SECRET
        sync: false
databases:
  - name: goodplanner-db
    plan: free
    region: singapore
    databaseName: goodplanner
    user: goodplanner
