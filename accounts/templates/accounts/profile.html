{% extends "base.html" %}
{% block title %}โปรไฟล์ — Good Planner{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-slate-200 rounded-lg shadow-sm p-8 mt-4">
  <h1 class="text-xl font-semibold mb-6 brand">แก้ไขโปรไฟล์</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-4">
        <label for="{{ field.id_for_label }}" class="block text-xs font-semibold text-slate-600 mb-1">
          {{ field.label }}
        </label>
        {{ field }}
        {% for error in field.errors %}
          <p class="text-xs text-red-600 mt-1">{{ error }}</p>
        {% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="bg-slate-900 text-white rounded-md px-5 py-2 text-sm font-semibold hover:opacity-90 transition">
      บันทึก
    </button>
  </form>
</div>
{% endblock %}
